<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a12" />
  <link rel="icon" href="data:," />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="classic">
  <main class="app">
    <header class="title">
      <h1>TETRIS</h1>
      <div class="session-label" id="mode-label">MARATHON</div>
    </header>

    <section class="game" id="game-area" aria-label="Tetris game">
      <section class="box preview hold-box" aria-label="Held piece">
        <h2>HOLD</h2>
        <canvas id="hold" width="120" height="80" role="img" aria-label="No held piece"></canvas>
      </section>

      <section class="stage">
        <div class="field-shell">
          <canvas id="field" width="300" height="600" tabindex="-1" role="img" aria-label="Tetris playfield. Use touch gestures or keyboard controls."></canvas>
          <div class="callout" id="callout" aria-hidden="true">
            <strong id="callout-title"></strong>
            <span id="callout-detail"></span>
          </div>
        </div>
        <p class="gesture-hint" id="gesture-hint">Drag to move · Tap sides to rotate · Swipe up to hold · Flick down to drop</p>
      </section>

      <section class="box preview next-box" aria-label="Next pieces">
        <h2>NEXT</h2>
        <canvas id="next" width="120" height="400" role="img" aria-label="Upcoming pieces"></canvas>
      </section>

      <section class="box stats" aria-label="Current game statistics">
        <div class="stat"><span>SCORE</span><b id="score">0</b></div>
        <div class="stat"><span>LEVEL</span><b id="level">1</b></div>
        <div class="stat"><span>LINES</span><b id="lines">0</b></div>
        <div class="stat optional-stat"><span>COMBO</span><b id="combo">-</b></div>
        <div class="stat optional-stat"><span>B2B</span><b id="b2b">-</b></div>
        <div class="stat"><span>TIME</span><b id="time">00:00</b></div>
      </section>

      <button class="pause-control" id="pause-control" type="button" aria-label="Pause game">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>

      <p class="desktop-hint">
        Arrow keys move · Z/Up rotate · A rotates 180 · Space drops · C holds · P pauses
      </p>
    </section>
  </main>

  <div class="overlay show" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-card" id="overlay-card">
      <h2 id="overlay-title">LOADING</h2>
      <p class="muted">Starting the engine...</p>
    </div>
  </div>

  <div class="sr-only" id="live-status" aria-live="assertive" aria-atomic="true"></div>

  <script src="wasm_exec.js"></script>
  <script src="main.js"></script>
</body>
</html>
